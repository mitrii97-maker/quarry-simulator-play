<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volvo EC700CL — модель по референсу</title><style>body{margin:0;overflow:hidden;background:#768188;font:14px Arial;color:#eee}header{position:fixed;top:16px;left:20px;padding:12px 17px;background:#182328db;border:1px solid #99a59d55;border-radius:3px}header b{display:block;font-size:19px;letter-spacing:2px}header small{display:block;color:#c4c5b4;margin-top:7px}nav{position:fixed;bottom:15px;left:20px;display:flex;gap:8px;flex-wrap:wrap}button{padding:12px 20px;border:1px solid #87958e;border-radius:3px;background:#182328db;color:#efeee1;cursor:pointer}button[aria-pressed=true]{background:#b9a36e;color:#142127}#data{position:fixed;right:15px;bottom:15px;max-width:230px;font-size:10px;opacity:.7}#status{position:fixed;top:18px;right:20px}</style><script>Object.defineProperty(window,'localStorage',{value:{getItem:k=>k==='quarry-machine-v1'?'volvo':null,setItem(){},removeItem(){}}})</script></head><body><header><b>VOLVO EC700CL</b><small>3D-модель по предоставленной схеме</small></header><span id="status">Готовим модель…</span><nav><button id="side">Профиль</button><button id="rear">Сзади</button><button id="three">Общий вид</button><button id="cab">Из кабины</button></nav><output id="data"></output><script type="module">
import * as T from './three.module.js';
import {RoomEnvironment} from './RoomEnvironment.js?build=volvo-review-v2';
import {makeExcavator} from './new/rig.js?build=volvo-review-v2';
import {makeMaterials} from './new/world.js?build=volvo-review-v2';
import {START} from './new/physics.js?build=volvo-review-v2';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#96a3a9');const pm=new T.PMREMGenerator(renderer),environment=pm.fromScene(new RoomEnvironment(),.04);scene.environment=environment.texture;scene.environmentIntensity=.65;pm.dispose();
scene.add(new T.HemisphereLight('#dce9f0','#5c615b',.5));const sun=new T.DirectionalLight('#fff2d9',2.5);sun.position.set(6,15,-9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:.2,far:60});sun.shadow.normalBias=.018;sun.shadow.bias=-.0001;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#88928c',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const M=makeMaterials(renderer),rig=makeExcavator(scene,M),state={...START,baseX:0,baseY:0,baseZ:0,yaw:0,boom:.85,stick:-1.95,curl:2.05,payload:0,velocity:{...START.velocity}};rig.update(state,0);rig.root.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(rig.root),centre=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3()),ortho=new T.OrthographicCamera(),eye=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,100);let camera=ortho,view='three';
function draw(){renderer.setSize(innerWidth,innerHeight);const aspect=innerWidth/innerHeight,h=Math.max(size.y*1.28,size.x/aspect*1.25);Object.assign(ortho,{left:-h*aspect/2,right:h*aspect/2,top:h/2,bottom:-h/2,near:.1,far:150});ortho.updateProjectionMatrix();eye.aspect=aspect;eye.updateProjectionMatrix();for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(b.id===view));if(view==='cab'){camera=eye;eye.position.copy(rig.seat);eye.lookAt(rig.seat.clone().add(new T.Vector3(10,-4,0)));}else{camera=ortho;ortho.position.copy(centre).add(view==='side'?new T.Vector3(0,0,-30):view==='rear'?new T.Vector3(-30,0,0):new T.Vector3(15,9,-21));ortho.lookAt(centre);}renderer.render(scene,camera);document.getElementById('status').textContent='';document.getElementById('data').textContent=JSON.stringify({view,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles,cabFloor:rig.house.position.y+rig.cab.position.y,pinX:rig.stick.position.x});}
for(const b of document.querySelectorAll('nav button'))b.onclick=()=>{view=b.id;draw()};addEventListener('resize',draw);draw();
</script></body></html>
